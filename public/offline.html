<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0B0709">
    <meta name="robots" content="noindex">
    <title>Bağlantı yok · Ruhscans</title>
    <link rel="icon" href="/favicon-neutral.svg" type="image/svg+xml">
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        html, body { margin: 0; min-height: 100dvh; }
        body {
            background: #0B0709;
            color: #F3E9EE;
            font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
            display: grid;
            place-items: center;
            padding: 24px;
        }
        main {
            width: min(100%, 420px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.03);
            padding: 28px;
            text-align: center;
        }
        p { color: rgba(243, 233, 238, 0.7); font-size: 16px; line-height: 1.6; }
        h1 { font-size: 28px; margin: 0 0 12px; }
        button {
            min-height: 48px;
            width: 100%;
            border: 0;
            border-radius: 999px;
            background: #FF2E88;
            color: #0B0709;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <main>
        <h1>Bağlantı yok</h1>
        <p>Çevrimdışısın. Ruhscans kabuğu hazır; içerik için bağlantı geri geldiğinde tekrar dene.</p>
        <button type="button" onclick="location.reload()">Tekrar dene</button>
    </main>
</body>
</html>
